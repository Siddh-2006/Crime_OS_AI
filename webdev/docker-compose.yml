# version: '3.9'

services:
  # ─── MongoDB ────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: crime_os_mongodb
    # restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: crime_os
    volumes:
      - mongodb_data:/data/db
    # networks:
    #   - crime_os_network
    # healthcheck:
    #   test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 5

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: crime_os_redis
    # restart: unless-stopped
    ports:
      - '6379:6379'
    # command: redis-server --appendonly yes  # Data survives server restarts.
    volumes:
      - redis_data:/data
    # networks:
    #   - crime_os_network
    # healthcheck:
    #   test: ['CMD', 'redis-cli', 'ping']
    #   interval: 30s
    #   timeout: 10s
    #   retries: 5

