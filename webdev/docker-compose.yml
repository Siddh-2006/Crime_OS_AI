  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: crime_os_backend
  #   restart: unless-stopped
  #   ports:
  #     - '5000:5000'
  #   env_file:
  #     - ./backend/.env
  #   environment:
  #     MONGODB_URI: mongodb://mongodb:27017/crime_os
  #     REDIS_HOST: redis
  #     BULL_REDIS_HOST: redis
  #   depends_on:
  #     mongodb:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - crime_os_network
  #   volumes:
  #     - ./backend/logs:/app/logs

  # ─── Qdrant Vector Database ────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.1
    container_name: crime_os_qdrant
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage

