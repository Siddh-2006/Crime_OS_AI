<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gujarat Police Emblem Loader</title>
    <style>
body {
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.loader-container {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.police-loader {
    width: 200px;
    height: auto;
    display: block;
    overflow: visible;
}

/* ── Keyframes: fade-in reveal + subtle motion ── */

/* Old scaling-based entry animation (kept commented):
@keyframes shieldReveal {
    0%   { opacity: 0; transform: scale(0.85); }
    100% { opacity: 1; transform: scale(1); }
}

@keyframes wreathReveal {
    0%   { opacity: 0; transform: scale(0.75); }
    100% { opacity: 1; transform: scale(1); }
}

@keyframes lionReveal {
    0%   { opacity: 0; transform: scale(0.90) translateY(-8px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
}

@keyframes textReveal {
    0%   { opacity: 0; transform: scale(0.95); }
    100% { opacity: 1; transform: scale(1); }
}
*/

@keyframes shieldReveal {
    0%   { opacity: 0; }
    100% { opacity: 1; }
}

@keyframes wreathReveal {
    0%   { opacity: 0; }
    100% { opacity: 1; }
}

@keyframes lionReveal {
    0%   { opacity: 0; transform: translateY(-8px); }
    100% { opacity: 1; transform: translateY(0); }
}

@keyframes textReveal {
    0%   { opacity: 0; }
    100% { opacity: 1; }
}

/* @keyframes subtleRotate {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
} */

/* ── SVG group animations ── */

.shield-base {
    opacity: 0;
    transform-origin: 140.5px 180.5px;
    animation: shieldReveal 2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    animation-delay: 0s;
}

.wreath-group {
    opacity: 0;
    transform-origin: 140.5px 220px;
    animation-name: wreathReveal, subtleRotate;
    animation-duration: 2s, 24s;
    animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1), linear;
    animation-fill-mode: forwards, none;
    animation-iteration-count: 1, infinite;
    animation-delay: 2s;
}

.lion-capital {
    opacity: 0;
    transform-origin: 140.5px 120px;
    animation: lionReveal 2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    animation-delay: 0s;
}

.local-text-group {
    opacity: 0;
    transform-origin: 140.5px 295px;
    animation: textReveal 2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    animation-delay: 4s;
}

.motto-text-group {
    opacity: 0;
    transform-origin: 140.5px 90px;
    animation: textReveal 2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    animation-delay: 6s;
}

/* ── Loading text ── */
.loading-msg {
    margin-top: 16px;
    color: #24326d;
    font-weight: 700;
    font-size: 0.9rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    opacity: 0;
    animation: textReveal 2s ease-out forwards;
    animation-delay: 5s;
}
    </style>
</head>
